services:
  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    environment:
      - CORS_ORIGINS=["http://localhost:3000"]
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    environment:
      # Server-side only: Next.js's own rewrite (next.config.ts) proxies
      # /api/* to this backend. NEXT_PUBLIC_API_BASE_URL stays UNSET here
      # on purpose -- the browser must only ever call this same origin
      # (see backend/CLAUDE.md), never the backend container directly.
      - BACKEND_INTERNAL_URL=http://backend:8000
    depends_on:
      - backend
    command: npm run dev
